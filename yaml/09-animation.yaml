# ==========================================================
# 09-animation.yaml
# Motion Design Specification
# Dr. Pawan Kumar Sadhvani Website
# ==========================================================

animations:

# ==========================================================
# GLOBAL
# ==========================================================

global:

  enabled: true

  library: Framer Motion

  respectReducedMotion: true

  easing:

    standard: "easeOut"

    smooth: "easeInOut"

  duration:

    fast: 0.15

    normal: 0.25

    slow: 0.40

# ==========================================================
# PAGE LOAD
# ==========================================================

page:

  initial:

    opacity: 0

  animate:

    opacity: 1

  duration: 0.35

# ==========================================================
# HEADER
# ==========================================================

header:

  sticky:

    enabled: true

  scroll:

    shrink: true

    shadow: true

# ==========================================================
# HERO
# ==========================================================

hero:

  content:

    fade: true

    slideUp: true

    delay: 0.10

  image:

    fade: true

    scale: 1.02

# ==========================================================
# SECTION TITLES
# ==========================================================

sectionTitles:

  animation:

    fadeUp: true

    delay: 0.10

# ==========================================================
# CARDS
# ==========================================================

cards:

  stagger:

    enabled: true

    interval: 0.08

  hover:

    lift: true

    scale: 1.02

    shadowIncrease: true

# ==========================================================
# BUTTONS
# ==========================================================

buttons:

  hover:

    scale: 1.03

  tap:

    scale: 0.98

# ==========================================================
# CAROUSELS
# ==========================================================

carousels:

  transition:

    duration: 0.35

    easing: easeOut

  swipe:

    enabled: true

# ==========================================================
# PATIENT STORIES
# ==========================================================

patientStories:

  cards:

    fadeUp: true

    stagger: true

# ==========================================================
# DOCTOR CARDS
# ==========================================================

doctorCards:

  hover:

    lift: true

# ==========================================================
# CTA
# ==========================================================

cta:

  fadeUp: true

# ==========================================================
# FOOTER
# ==========================================================

footer:

  fade: true

# ==========================================================
# PERFORMANCE
# ==========================================================

performance:

  animateOnce: true

  viewportAmount: 0.20

  useGPUTransforms: true

# ==========================================================
# ACCESSIBILITY
# ==========================================================

accessibility:

  prefersReducedMotion:

    disable:

      - parallax

      - scale

      - stagger

# ==========================================================
# IMPLEMENTATION RULES
# ==========================================================

implementation:

  useFramerMotion: true

  noInfiniteAnimations: true

  noAutoScrolling: true

  keepAnimationsSubtle: true

  neverDelayUserInteraction: true

# ==========================================================
# END OF FILE
# ==========================================================