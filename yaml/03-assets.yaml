# ==========================================================
# HOSPITALS
# ==========================================================

hospitals:

  asterPrime:

    src: "assets/hospitals/asterPrimeHospital.jpg"

    alt: "Aster Prime Hospital Hyderabad"

  yashoda:

    src: "assets/hospitals/yashodaHospital.jpg"

    alt: "Yashoda Hospital Hyderabad"

# ==========================================================
# ICON STRATEGY
# ==========================================================

icons:

  provider: "lucide-react"

  importStyle: "named"

  customImageIcons: false

  examples:

    - Calendar
    - Phone
    - MapPin
    - ChevronRight
    - ChevronLeft
    - Menu
    - Play
    - Star
    - Users
    - Stethoscope
    - ShieldCheck
    - Building2
    - MessageCircle
    - ArrowRight

# ==========================================================
# IMAGE LOADING
# ==========================================================

loading:

  hero:

    priority: true

    lazy: false

  belowFold:

    lazy: true

  decoding: "async"

# ==========================================================
# IMAGE RULES
# ==========================================================

rules:

  - Never hardcode image paths inside React components.
  - Import assets only from this registry.
  - Hero images must be eager-loaded.
  - All remaining images should lazy-load.
  - Every image must have descriptive alt text.
  - Preserve original aspect ratios unless specified by the approved mock.
  - Do not substitute assets without updating this file.

# ==========================================================
# END OF FILE
# ==========================================================
