# ==========================================================
# 03-assets.yaml
# Asset Registry
# Ortho-Neuro Cerebral Palsy & Spasticity Clinic Website
# ==========================================================

assets:

  root: "/assets"

# ==========================================================
# LOGOS
# ==========================================================

logos:

  primary:

    src: "assets/logos/ortho-neuro-logo-horizontal.png"

    alt: "Ortho-Neuro Cerebral Palsy & Spasticity Clinic"

    usage:

      - header
      - desktop
      - mobile

  footer:

    src: "assets/logos/ortho-neuro-logo-horizontal-white.png"

    alt: "Ortho-Neuro Cerebral Palsy & Spasticity Clinic"

    usage:

      - footer

# ==========================================================
# HERO
# ==========================================================

hero:

  desktop:

    src: "assets/hero/desktopHeroBanner.png"

    alt: "Dr. Pawan Kumar Sadhvani hero banner"

    loading: eager

    priority: true

  mobile:

    src: "assets/hero/mobileHeroBanner.png"

    alt: "Mobile hero banner"

    loading: eager

    priority: true

