token_policy:
  primary_rule: Reuse the existing SDR/SMF global tokens. The values below are fallbacks inferred from approved mocks.
  do_not_override_existing_global_theme: true
colors:
  navy_primary: '#082A83'
  blue_cta: '#0632A6'
  teal_primary: '#087A7A'
  teal_dark: '#066A6A'
  orange_warning: '#F58220'
  text_primary: '#0A2A70'
  text_secondary: '#334A74'
  background_page: '#FFFFFF'
  background_soft_blue: '#F5FAFF'
  background_cta: '#F2F5FF'
  background_warning: '#FFF6EE'
  border_subtle: '#E6ECF4'
  divider: '#DCE5EF'
  focus_ring: '#1D4ED8'
spacing:
  base_px: 8
  scale_px:
  - 0
  - 4
  - 8
  - 12
  - 16
  - 20
  - 24
  - 32
  - 40
  - 48
  - 64
  - 80
radius:
  small_px: 8
  card_px: 12
  large_card_px: 16
  pill_px: 999
borders:
  default: '1px solid #E6ECF4'
  selected: '1px solid #087A7A'
shadow:
  card: 0 1px 2px rgba(8, 42, 131, 0.06)
  sticky_header: 0 2px 10px rgba(8, 42, 131, 0.08)
typography:
  font_family: 'Use the existing project font stack; fallback: Inter, system-ui, sans-serif'
  desktop:
    page_title:
      size_px: 40
      weight: 700
      line_height: 1.15
    page_subtitle:
      size_px: 24
      weight: 700
      line_height: 1.25
    section_title:
      size_px: 20
      weight: 700
      line_height: 1.3
    card_title:
      size_px: 16
      weight: 600
      line_height: 1.35
    body:
      size_px: 16
      weight: 400
      line_height: 1.6
    small:
      size_px: 14
      weight: 400
      line_height: 1.5
    button:
      size_px: 16
      weight: 600
      line_height: 1.2
    footer:
      size_px: 14
      weight: 400
      line_height: 1.5
  mobile:
    page_title:
      size_px: 32
      weight: 700
      line_height: 1.12
    page_subtitle:
      size_px: 20
      weight: 700
      line_height: 1.25
    section_title:
      size_px: 18
      weight: 700
      line_height: 1.3
    card_title:
      size_px: 16
      weight: 600
      line_height: 1.35
    body:
      size_px: 16
      weight: 400
      line_height: 1.55
    small:
      size_px: 14
      weight: 400
      line_height: 1.45
    button:
      size_px: 16
      weight: 600
      line_height: 1.2
  minimum_mobile_body_px: 16
