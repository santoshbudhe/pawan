non_negotiable_rules:
- Do not redesign approved sections.
- Do not rename, rewrite, replace, crop from, or silently substitute any approved file.
- Preserve the exact approved filenames.
- Treat mobile and desktop compositions as independent responsive references.
- Use editable React text for headings, paragraphs, labels, tags, buttons, accordions and footer content.
- Use Lucide icons for standard interface symbols.
- Do not crop production assets from page screenshots or grid screenshots.
- Do not fabricate before-and-after outcomes or patient evidence.
- Patient-story media may be shown only when consent-approved assets already exist in the project.
- Reuse the existing shared site header, footer, CTA, button, card and carousel primitives whenever suitable.
- Do not create new Firestore collections for static page copy.
implementation_mode:
  mobile_first: true
  desktop_reference_width: 1440
  desktop_container_max_width: 1280
  mobile_reference_width: 390
  spacing_base_unit: 8
