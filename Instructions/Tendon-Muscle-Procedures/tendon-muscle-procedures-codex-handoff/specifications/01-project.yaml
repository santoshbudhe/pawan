project:
  name: Dr. Pawan Kumar Sadhvani — Cerebral Palsy and Spasticity Website
  feature: Tendon & Muscle Procedures page
  page_type: procedure detail page
  implementation_stack:
  - React
  - TypeScript
  - Tailwind CSS
  - Firebase
  route:
    recommended: /procedures/tendon-muscle-procedures
    rule: Reuse the existing procedure routing convention; do not create a duplicate route if an equivalent route already
      exists.
  source_of_truth_priority:
  - Exact approved production hero artwork files
  - Clean mobile and desktop mocks
  - Technical grid references
  - Existing SDR and SMF implementation patterns
  - These YAML files and master instructions
