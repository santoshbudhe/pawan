existing_project_assets_to_reuse:
- role: site_logo
  required: true
  instruction: Use the existing approved site logo/component; do not extract it from a mock.
- role: doctor_portrait
  required: true
  instruction: Reuse the approved Dr. Pawan portrait already used on SDR/SMF pages.
- role: part_1_benefit_photo
  required: true
  instruction: Reuse the approved child gait-training/therapist image if it exists. Do not crop it from the mock.
- role: part_1_assessment_photo
  required: true
  instruction: Reuse the approved assessment image if it exists. Do not silently add unrelated stock media.
- role: part_2_hospital_recovery_photo
  required: true
  instruction: Reuse the approved child-with-clinician hospital image if it exists.
- role: comparison_medical_illustrations
  required: true
  instruction: Reuse approved Tendon/Muscle, SMF, SDR and deformity-correction illustrations from the project.
- role: patient_story_media
  required: false
  consent_required: true
  instruction: Show only existing consent-approved patient media. Never use the mock screenshots as patient evidence.
hero_artwork_behavior:
  desktop:
    filename: 1000105002.png
    use_with: picture/source for desktop and tablet-wide screens
    object_fit: cover
    object_position: center right
  mobile:
    filename: 1000105007.png
    use_with: picture/source for mobile screens
    object_fit: cover
    object_position: center
  note: The supplied hero assets include approved baked-in medical wording. Do not overlay duplicate versions of that wording.
asset_gate:
- Fail the final production build if either exact hero file is missing or renamed.
- Do not fail early implementation solely because shared reusable assets have different project filenames; resolve them by
  role.
- Do not publish patient-story cards with non-consented or fabricated media.
