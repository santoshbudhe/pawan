- website/smf/illustrations/comparison-sdr.webp
- website/smf/illustrations/comparison-tendon-muscle.webp
- website/smf/illustrations/comparison-deformity-correction.webp
seed_contract:
  smf:
    route: /procedures/selective-motor-fasciculotomy
    hero_mobile_url: resolved uploaded asset URL
    hero_desktop_url: resolved uploaded asset URL
    media_urls: key-value object generated by uploadAssets.ts
    is_published: true
  global_settings:
    assessment_cta_target: existing route or modal id
    care_team_cta_target: existing contact/WhatsApp/modal target
