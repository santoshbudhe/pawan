- id: patient-journeys
  number: 7
  part: 2
  title: Real patient journeys after SMF
  stories:
  - case: Case 1
    title: Better hand opening & daily use
    body: A 9-year-old child with spastic diplegia who had SMF of the median nerve branches.
    outcome: Improved hand opening, easier self-care and better participation.
  - case: Case 2
    title: Reduced knee flexion spasticity
    body: A 12-year-old child with spastic diplegia had SMF for hamstring overactivity.
    outcome: Easier standing and walking with improved balance and comfort.
  disclaimer: All patients are unique. Results depend on individual condition, treatment and follow-up care.
- id: faq
  number: 8
  part: 2
  title: Frequently asked questions
  questions:
  - What is Selective Motor Fasciculotomy (SMF)?
  - Is SMF the same as hyperselective neurectomy?
  - Can SMF treat upper-limb spasticity?
  - Can SMF treat lower-limb spasticity?
  - How is SMF different from SDR?
