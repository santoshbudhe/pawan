state_management:
  preferred:
    - "Local component state for individual accordions."
    - "Local component state for inline View all expansion."
    - "Existing carousel library state or reusable carousel hook."
    - "Existing assessment and contact global flow."

  global_state_not_required:
    - "Problem carousel index"
    - "FAQ open item"
    - "Risk open item"
    - "Patient-story carousel index"

  url_state:
    required: false
    exception: "Allow normal section hashes for direct anchor navigation."

performance:
  code_splitting:
    page: "Recommended"
    heavy_below_fold_components: "May be dynamically imported when this matches existing architecture"

  assets:
    hero:
      loading: "eager"
      fetch_priority: "high"

    below_fold:
      loading: "lazy"
      decoding: "async"

  rendering:
    - "Provide image dimensions or CSS aspect ratios."
    - "Avoid cumulative layout shift."
    - "Do not load both full-resolution hero files unnecessarily."
    - "Use picture, source media queries or equivalent responsive selection."
    - "Avoid unnecessary re-renders of static card data."

accessibility_requirements:
  page:
    - "Use one H1."
    - "Use logical H2 and H3 hierarchy."
    - "Use semantic sections with unique IDs."
    - "Provide a skip-to-content target if supported by the shared shell."

  carousels:
    - "Provide descriptive region labels."
    - "Label Previous and Next controls."
    - "Do not trap keyboard focus."
    - "Support keyboard navigation."
    - "Do not automatically rotate."
    - "Respect reduced-motion settings."

  accordions:
    - "Use buttons for accordion triggers."
    - "Set aria-expanded."
    - "Set aria-controls."
    - "Associate each trigger with a unique panel ID."
    - "Make the full visible row clickable."

  images:
    - "Use descriptive alt text for meaningful images."
    - "Use empty alt text for decorative medical artwork."
    - "Provide equivalent hidden text for information baked into hero images."

  controls:
    - "Maintain visible focus rings."
    - "Maintain 44px minimum touch targets."
    - "Do not use icon-only controls without accessible labels."

responsive_component_rules:
  desktop:
    breakpoint: "1200px and above"

    rules:
      - "Use the 12-column 1280px centred layout."
      - "Use approved paired sections."
      - "Use equal-height repeated cards where shown."
      - "Show the desktop navigation."
      - "Use 1000104957.png for the hero."

  tablet:
    breakpoint: "768px to 1199px"

    rules:
      - "Use an 8-column layout."
      - "Collapse four-card rows to two cards where required."
      - "Convert wide repeated-card rows to carousels when necessary."
      - "Do not invent a separate tablet design."

  mobile:
    breakpoint: "below 768px"

    rules:
      - "Use the four-column mobile grid."
      - "Use 16px side padding."
      - "Stack all major sections vertically."
      - "Do not place major sections side by side."
      - "Use 1000104949.png for the hero."
      - "Use full-width primary information cards."
      - "Use horizontal carousels for repeated compact cards."
      - "Allow text to wrap naturally."
      - "Maintain at least 16px body text."

testing:
  component_tests:
    - "SdrHero selects the correct responsive asset."
    - "SdrProblemsCarousel expands inline."
    - "SdrRisksAccordion opens and closes one item at a time."
    - "SdrFaqAccordion expands FAQs inline."
    - "PatientJourneysCarousel expands inline without routing."
    - "TreatmentComparisonCarousel links SMF correctly."
    - "Current SDR comparison card is not an active navigation link."
    - "Closing CTA calls the shared assessment and contact actions."

  route_tests:
    - "Homepage SDR card navigates to the SDR route."
    - "Direct navigation to the SDR URL renders the page."
    - "Only one shared header renders."
    - "Only one shared footer renders."

  responsive_tests:
    viewports:
      - width: 390
        type: "mobile"

      - width: 768
        type: "tablet"

      - width: 1024
        type: "tablet"

      - width: 1440
        type: "desktop"

    assertions:
      - "No horizontal page overflow."
      - "No body text below the approved minimum."
      - "Major mobile sections are not side by side."
      - "Hero artwork and magnifier remain visible."
      - "Buttons meet minimum touch-target requirements."

validation_checklist:
  - "SdrProcedurePage follows the exact approved section order."
  - "Part 1 and Part 2 are joined into one page."
  - "Continuation labels are not rendered."
  - "Shared components are reused rather than duplicated."
  - "The exact hero filenames are used."
  - "The Mobile Part 1 How SDR works section is present."
  - "Homepage SDR navigation works."
  - "View all actions remain inline."
  - "No unapproved routes are invented."
  - "Medical and patient content is verified before publication."
  - "All components are keyboard accessible."
  - "The implementation remains visually consistent with the SMF page."
