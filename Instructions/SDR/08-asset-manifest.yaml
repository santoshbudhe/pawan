        - "Specialized Procedure eyebrow"
        - "SDR page heading"
        - "Hero supporting paragraph"
        - "Procedure tags"
        - "Request Assessment button"
        - "Talk to Our Team button"

      positioning:
        object_fit: "cover"
        object_position: "center right"
        preserve:
          - "Complete magnifier"
          - "Complete baked-in sentence"
          - "Highlighted lower-spine nerves"
          - "Safe space for React content"

      accessibility:
        visual_alt: ""
        treatment: "Decorative composite with an equivalent HTML or visually hidden explanation"
        equivalent_text: >
          Only the abnormal sensory nerve signals are selectively treated while
          preserving strength and feeling.

    desktop:
      filename: "1000104957.png"
      media_type: "image/png"
      dimensions:
        width: 1536
        height: 614
      aspect_ratio: "approximately 2.5 / 1"
      role: "Final production SDR desktop hero composite"
      production_asset: true
      ship_to_production: true
      breakpoint_usage: "1200px and above, and wide tablet only when composition remains safe"

      contains:
        - "Wide pale medical background"
        - "Anatomical spinal and lower-limb nerve illustration"
        - "Circular magnification detail"
        - "Connector lines"
        - "Baked-in explanatory sentence"
        - "Clear empty region for React-rendered content"

      does_not_contain:
        - "Breadcrumb"
        - "Specialized Procedure eyebrow"
        - "SDR page heading"
        - "Hero supporting paragraph"
        - "Procedure tags"
        - "Request Assessment button"
        - "Talk to Our Team button"

      positioning:
        object_fit: "cover"
        object_position: "center right"
        recommended_render_size:
          width: "100%"
          height: "approximately 512px to 576px"
        preserve:
          - "Complete anatomical figure"
          - "Complete magnifier"
          - "Complete baked-in sentence"
          - "Left-side React-content safe area"

      accessibility:
        visual_alt: ""
        treatment: "Decorative composite with an equivalent HTML or visually hidden explanation"
        equivalent_text: >
          Only the abnormal sensory nerve signals are selectively treated while
          preserving strength and feeling.

hero_asset_selection:
  preferred_element: "picture"

  implementation_example:
    structure:
      - "Use a mobile source for max-width: 767px."
      - "Use the desktop source for min-width: 1200px."
      - "Use the safest approved crop for the tablet range."
      - "Render the React content separately from the image."

  mobile:
    source: "1000104949.png"
    media_query: "(max-width: 767px)"

  desktop:
    source: "1000104957.png"
    media_query: "(min-width: 1200px)"

  tablet:
    source_selection: "Responsive art-direction decision"
    rule:
      - "Prefer 1000104957.png when the full right-side artwork remains visible."
      - "Use 1000104949.png on narrow portrait tablets when the desktop sentence or magnifier would be clipped."
      - "Do not display both assets simultaneously."

  loading:
    loading: "eager"
    decoding: "async"
    fetch_priority: "high"

  layout_shift:
    reserve_space: true
    use_intrinsic_dimensions: true
    use_css_aspect_ratio: true

  prohibited:
    - "Do not use the clean mock as the hero background."
    - "Do not add the mobile and desktop hero images into the same visible layer."
    - "Do not crop away the baked-in sentence."
    - "Do not duplicate the baked-in sentence as visible copy."
    - "Do not replace the hero with a generic spine image."

reference_file_handling:
  clean_mocks_and_grids:
    production_import: false

    accepted_uses:
      - "Visual implementation comparison"
      - "Pixel and spacing reference"
      - "Manual quality assurance"
      - "Codex development context"

    prohibited_uses:
      - "Rendering as a page background"
      - "Rendering as a full-page image"
      - "Cropping individual production assets from them"
      - "Shipping them as visible website content"
      - "Using their text instead of semantic HTML"

  repository_storage:
    preferred: "Keep outside the production bundle in a design-reference directory when the project supports it."
    example: "design-references/sdr/"
    filename_preservation_required: true

shared_existing_assets_to_reuse:
  lookup_rule:
    - "Search the existing website asset inventory before creating a new file."
    - "Reuse an existing asset only when its subject and crop match the approved SDR mock."
    - "Do not reuse an asset merely because it is medically themed."
    - "Do not alter an existing shared asset in a way that changes another page."

  assets:
    site_logo:
      asset_id: "site-logo-primary"
      source: "Existing shared website header"
      required: true
      create_new: false
      expected_usage:
        - "Desktop header"
        - "Mobile header"

    footer_logo:
      asset_id: "site-logo-footer"
      source: "Existing shared website footer"
      required: true
      create_new: false

    doctor_review_portrait:
      asset_id: "dr-pawan-review-portrait"
      source: "Existing approved Dr. Pawan portrait"
      required: true
      create_new: false
      usage: "Medically reviewed by card"
      recommended_crop: "Square or circular portrait"
      recommended_dimensions: "Minimum 320px by 320px"
      object_position: "center top"
      alt: "Dr. Pawan Kumar Sadhvani"

    rehabilitation_photo:
      asset_id: "shared-child-rehabilitation-photo"
      source: "Existing approved website rehabilitation imagery"
      reuse_allowed: true
      condition: "The subject and direction must match the relevant SDR section."

    hospital_or_clinical_icons:
      source: "Lucide or existing SVG system"
      raster_asset_required: false

supporting_raster_assets:
  status_rule: >
    These images are visible in the approved mocks but are not separately
    included among the 10 supplied files. Codex must first locate an approved
    equivalent in the existing website asset library. If none exists, mark the
    asset as missing and request it rather than extracting it from a screenshot.

  general_requirements:
    important_text_baked_in: false
    buttons_baked_in: false
    labels_baked_in: false
    logos_baked_in: false
    realistic_medical_context: true
    patient_consent_required_where_applicable: true

  assets:
    sdr_benefit_rehabilitation_image:
