  production_hero_assets:
    mobile:
      filename: "1000104949.png"
      media_type: "image/png"
      dimensions:
        width: 1024
        height: 1536
      aspect_ratio: "2 / 3"
      role: "Final production SDR mobile hero composite"
      production_asset: true
      ship_to_production: true
      breakpoint_usage: "Below 768px and narrow tablet only when composition remains safe"

      contains:
        - "Anatomical spinal and lower-limb nerve illustration"
        - "Circular magnification detail"
        - "Connector lines"
        - "Baked-in explanatory sentence"

