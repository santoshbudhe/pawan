        width: 720
        height: 1536
      role: "SDR Mobile Part 1 grid and measurement reference"
      production_asset: false
      ship_to_production: false

      known_limitation:
        issue: "The complete How SDR works section is not visibly included."
        resolution:
          - "Do not omit How SDR works."
          - "Use 1000104948.png and the desktop references for that section."
          - "Use 07-responsive-layout.yaml for its mobile implementation."

    mobile_part_2:
      filename: "1000104956.png"
      media_type: "image/png"
      dimensions:
        width: 1224
        height: 1536
