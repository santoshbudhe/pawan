    rename_originals: false

    optimisation:
      allowed:
        - "Generate framework-managed responsive derivatives while keeping the original filename available."
        - "Use image-CDN transformation when the existing project already supports it."
        - "Compress without visibly degrading anatomical details or text."

      prohibited:
        - "Do not overwrite the original files with lower-quality versions."
        - "Do not change the file extension in the manifest."
        - "Do not blur the baked-in explanatory sentence."

  supporting_assets:
    preferred_format: "WebP"
    jpg_allowed: true
    png_allowed:
      - "Transparent illustrations"
      - "Medical diagrams requiring lossless detail"

    responsive_sizes:
      desktop:
        recommended_widths:
          - 640
          - 960
          - 1280
          - 1600

      mobile:
        recommended_widths:
          - 390
          - 640
          - 800

  compression:
    photographic_webp_quality: "recommended 78 to 85"
    jpeg_quality: "recommended 80 to 88"
    png: "lossless optimisation"

  loading:
    hero: "eager"
    above_fold_logo: "eager"
    below_fold: "lazy"

    decoding:
      hero: "async"
      below_fold: "async"

  dimensions:
    width_height_attributes_required: true
    css_aspect_ratio_required: true
    avoid_layout_shift: true

asset_fallbacks:
  hero_load_failure:
    background: "#EAF6FB"
    preserve_html_content: true
    broken_image_icon_visible: false

  missing_supporting_photo:
    behaviour:
      - "Preserve the section and its HTML content."
      - "Omit the media block cleanly or use an existing approved neutral placeholder component."
      - "Record the asset as unresolved."

    prohibited:
      - "Do not crop the image from a page mock."
      - "Do not insert an unrelated stock photograph."
      - "Do not generate a fabricated patient outcome."

  missing_custom_svg:
    fallback:
      - "Use the closest medically appropriate Lucide icon where one exists."
      - "Maintain the same card spacing and dimensions."

    rule: "Do not delay essential content solely because a decorative SVG is unavailable."

security_and_privacy:
  patient_media:
    consent_required: true
    public_storage_review_required: true
    remove_sensitive_metadata: true
    expose_personal_filenames: false

  image_metadata:
    strip_exif_where_appropriate: true
    preserve_required_colour_profile: true

  external_assets:
    hotlinking_prohibited: true
    local_or_approved_storage_required: true

homepage_asset_integration:
  source: "Existing homepage SDR procedure card"
  destination: "/procedures/selective-dorsal-rhizotomy"

  requirements:
    - "Do not create another SDR image or card when an existing one is present."
    - "Reuse the existing homepage SDR card asset."
    - "Make the existing card clickable."
    - "Do not use the procedure-page hero as the homepage card image unless explicitly approved."
    - "Do not change the homepage card crop merely to support routing."

asset_resolution_process:
  step_1:
    action: "Locate every exact supplied filename in the Codex workspace."
    failure: "Stop and report the missing filename."

  step_2:
    action: "Map 1000104949.png and 1000104957.png to the responsive hero."

  step_3:
    action: "Treat the eight mock and grid files as non-production references."

  step_4:
    action: "Search the existing website asset inventory for every listed supporting raster asset."

  step_5:
    action: "Reuse only approved assets that match the required subject and crop."

  step_6:
    action: "Create the listed custom SVGs using the existing icon style."

  step_7:
    action: "Report unresolved raster assets before replacing them."

validation:
  supplied_files:
    - "All 10 exact filenames exist."
    - "No supplied filename has been changed."
    - "No extension has been changed."
    - "The mobile hero is 1000104949.png."
    - "The desktop hero is 1000104957.png."

  reference_usage:
    - "The eight page mocks and grid boards are not rendered in production."
    - "No individual asset has been cropped from a reference screenshot."
    - "The clean mocks remain available for QA comparison."

  hero:
    - "The mobile hero is used below the mobile breakpoint."
    - "The desktop hero is used at desktop sizes."
    - "The magnifier remains visible."
    - "The complete baked-in sentence remains visible."
    - "The React title, description, tags and buttons remain separate."
    - "Equivalent accessible text is present."
    - "Both hero images are not downloaded unnecessarily when responsive source selection can prevent it."

  supporting_assets:
    - "Every supporting raster image is either matched to an approved existing file or marked unresolved."
    - "No unrelated stock image has been silently substituted."
    - "No patient image is published without consent."
    - "Before and After labels remain HTML."

  icons:
    - "Lucide icons are imported individually."
    - "Decorative icons are hidden from assistive technology."
    - "Icon-only controls have accessible labels."
    - "Custom SVGs contain no baked-in text."

  performance:
    - "Hero dimensions are reserved before load."
    - "Below-fold images use lazy loading."
    - "Responsive image sizes are supplied where supported."
    - "No large reference screenshot is shipped in the user-facing bundle."

  regression:
    - "Existing shared logos and portraits are not duplicated."
    - "Existing homepage assets remain unchanged."
    - "Existing SMF assets are not overwritten."
    - "The homepage SDR link still navigates to /procedures/selective-dorsal-rhizotomy."
