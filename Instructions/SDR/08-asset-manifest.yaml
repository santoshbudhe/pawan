schema_version: "1.0"

file:
  name: "08-asset-manifest.yaml"
  purpose: >
    Defines the complete SDR asset inventory, exact supplied filenames,
    production-versus-reference usage, responsive hero mapping, reusable
    website assets, unresolved supporting assets, Lucide icons, custom SVG
    illustrations, CSS-only decorations, accessibility requirements and
    asset-validation rules.

page:
  id: "sdr-procedure-page"
  procedure: "Selective Dorsal Rhizotomy"
  abbreviation: "SDR"
  route: "/procedures/selective-dorsal-rhizotomy"

asset_policy:
  exact_uploaded_filenames_required: true
  rename_supplied_files: false
  change_file_extensions: false
  extract_assets_from_mock_screenshots: false
  use_mock_images_as_production_backgrounds: false
  create_duplicate_assets: false

  rules:
    - "Use the exact filenames listed in this manifest."
    - "Do not rename any of the 10 supplied files."
    - "The files may be placed in the existing project asset directory, but their basenames and extensions must remain unchanged."
    - "The four clean mocks and four grid boards are implementation references only."
    - "Only the two standalone SDR hero files are approved production assets from this supplied set."
    - "Do not crop supporting photos or illustrations from the page mocks."
    - "Do not recreate supplied hero artwork using CSS, Lucide icons or a different image."
    - "Do not bake editable headings, paragraphs, tags, buttons or navigation into new raster assets."
    - "Reuse suitable existing website assets before requesting or generating duplicates."
    - "Where an asset is unresolved, Codex must flag it rather than silently substituting unrelated stock imagery."

asset_location:
  preferred_directory: "Use the existing project convention for public or imported raster assets."

  accepted_examples:
    - "public/assets/procedures/sdr/"
    - "src/assets/procedures/sdr/"
    - "Existing Firebase Storage asset path used by the project"

  filename_rule:
    preserve_basename: true
    preserve_extension: true

  import_rule:
    public_assets: "Reference using the existing public URL convention."
    source_assets: "Import using the existing TypeScript asset-import convention."
    firebase_assets: "Use the project's existing typed asset URL configuration."

supplied_files:
  total: 10

  clean_mocks:
    mobile_part_1:
      filename: "1000104948.png"
      media_type: "image/png"
      dimensions:
        width: 646
        height: 1536
      aspect_ratio: "646 / 1536"
      role: "Approved SDR Mobile Part 1 visual reference"
      production_asset: false
      ship_to_production: false

      controls:
        - "Mobile Part 1 section order"
        - "Mobile content composition"
        - "Mobile card treatment"
        - "Mobile hero HTML-content placement"
        - "Assessment and How SDR works design intent"

    mobile_part_2:
