      mobile_usage: "Full-width image below the benefit list when shown"
      recommended_dimensions:
        desktop: "1200px by 800px"
        mobile: "800px by 600px"
      aspect_ratio: "4 / 3"
      preferred_format: "WebP"
      transparent_background: false
      subject_position: "Centre or centre-right"
      text_baked_in: false
      alt: "Child practising supported movement during rehabilitation"

    sdr_assessment_image:
      asset_id: "sdr-assessment-image"
      status: "reuse-existing-or-missing"
      subject: "Clinician assessing a child's walking, posture or lower-limb movement"
      section: "Assessment & patient selection"
      desktop_usage: "Right-side media panel"
      mobile_usage: "Full-width image below the assessment steps"
      recommended_dimensions:
        desktop: "1200px by 900px"
        mobile: "800px by 600px"
      aspect_ratio: "4 / 3"
      preferred_format: "WebP"
      transparent_background: false
      subject_position: "Centre"
      text_baked_in: false
      alt: "Clinician assessing a child's walking and lower-limb movement"

    sdr_goals_image:
