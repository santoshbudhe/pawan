      dimensions:
        width: 614
        height: 1536
      aspect_ratio: "614 / 1536"
      role: "Approved SDR Mobile Part 2 visual reference"
      production_asset: false
      ship_to_production: false

      controls:
        - "Mobile Part 2 section order"
        - "Recovery and risk composition"
        - "Medical-review card"
        - "Team section"
        - "Patient stories"
        - "FAQs"
        - "References"
        - "Closing CTA and footer"

    desktop_part_1:
      filename: "1000104950.png"
      media_type: "image/png"
      dimensions:
        width: 1229
        height: 1536
      aspect_ratio: "1229 / 1536"
      role: "Approved SDR Desktop Part 1 visual reference"
      production_asset: false
      ship_to_production: false

      controls:
        - "Desktop Part 1 composition"
        - "Desktop card counts"
        - "Desktop paired-section layouts"
        - "Desktop assessment composition"
        - "Desktop How SDR works layout"

    desktop_part_2:
