    display: "flex"
    overflow_x: "auto"
    scroll_snap_type: "x mandatory"
    scrollbar_width: "none"
    overscroll_behaviour_inline: "contain"
    gap_desktop: "24px"
    gap_mobile: "16px"
    arrow_target_size: "44px"
    pagination_dot_size: "8px"
    active_dot_width: "24px"

  desktop:
    problems_cards_per_view: 5
    comparison_cards_per_view: 4
    patient_stories_per_view: 2
    show_arrows: true
    show_pagination: true

  mobile:
    problems_card_width: "recommended 112px to 136px"
    comparison_card_width: "min(82vw, 310px)"
    patient_story_width: "min(88vw, 342px)"
    next_card_peek: "16px to 32px"
    show_arrows: "Only where shown in the approved mock"
    show_pagination: true
    touch_swipe: true

  accessibility:
    previous_label: "Previous items"
    next_label: "Next items"
    region_role: "region"
    live_region: "polite only when needed"
    keyboard_navigation: true

accordions:
  row_min_height: "52px"
  mobile_row_min_height: "52px"
