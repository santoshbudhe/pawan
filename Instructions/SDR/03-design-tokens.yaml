      font_weight: 800
      letter_spacing: "-0.035em"
      max_width: "600px"

    hero_body:
      font_size: "18px"
      line_height: "30px"
      font_weight: 400
      max_width: "540px"

    section_number:
      font_size: "16px"
      line_height: "24px"
      font_weight: 700

    section_title:
