      desktop: "680px"
      mobile: "100%"

    paragraph_narrow:
      desktop: "560px"
      mobile: "100%"

    section_heading:
      desktop: "760px"
      mobile: "100%"

    hero_text:
      desktop: "560px"
      mobile: "100%"

spacing:
  scale:
    "0": "0"
    "1": "4px"
    "2": "8px"
    "3": "12px"
    "4": "16px"
    "5": "20px"
    "6": "24px"
    "8": "32px"
    "10": "40px"
    "12": "48px"
    "14": "56px"
    "16": "64px"
    "18": "72px"
    "20": "80px"
    "24": "96px"
    "28": "112px"
    "32": "128px"

  page:
    desktop_section_gap: "80px"
    desktop_section_gap_range: "72px to 96px"
    mobile_section_gap: "56px"
    mobile_section_gap_range: "48px to 72px"

  section_padding:
    desktop:
      standard: "80px 0"
      compact: "64px 0"
      spacious: "96px 0"

    mobile:
      standard: "56px 0"
      compact: "40px 0"
      spacious: "64px 0"

  component:
    card_padding_desktop: "24px"
    card_padding_mobile: "20px"
    compact_card_padding: "16px"
    large_card_padding_desktop: "32px"
    large_card_padding_mobile: "24px"
    button_inline_padding: "24px"
    button_gap: "12px"
    icon_text_gap: "12px"
    list_item_gap: "12px"
    card_grid_gap_desktop: "24px"
    card_grid_gap_mobile: "16px"
    carousel_gap_desktop: "24px"
    carousel_gap_mobile: "16px"

layout:
  desktop:
    reference_canvas_width: "1440px"
    content_max_width: "1280px"
    outer_margin_at_reference: "80px"
    page_padding_inline: "clamp(24px, 5.56vw, 80px)"
    columns: 12
    gutter: "24px"

    implementation:
      width: "100%"
      max_width: "1280px"
      margin_inline: "auto"
      padding_inline: "0 within the 1280px container"
      outer_wrapper_padding: "80px at 1440px viewport"

    calculated_column_width:
      formula: "(1280px - 11 × 24px) / 12"
      value: "84.6667px"

  tablet:
    breakpoint_range: "768px to 1199px"
    columns: 8
    gutter: "20px"
    page_padding_inline: "24px to 48px"
    content_max_width: "100%"

  mobile:
    reference_canvas_width: "390px"
    page_padding_inline: "16px"
    content_width: "358px"
    columns: 4
    gutter: "8px"

    calculated_column_width:
      formula: "(358px - 3 × 8px) / 4"
      value: "83.5px"

    implementation:
      width: "100%"
      max_width: "none"
      margin_inline: "auto"
      padding_inline: "16px"

  breakpoints:
    mobile_max: "767px"
    tablet_min: "768px"
    tablet_max: "1199px"
    desktop_min: "1200px"
    wide_desktop_min: "1440px"

radii:
  none: "0"
  small: "8px"
  medium: "12px"
  standard: "16px"
  large: "20px"
  extra_large: "24px"
  pill: "9999px"

  usage:
    tags: "9999px"
    buttons: "12px"
    compact_cards: "12px"
    standard_cards: "16px"
    large_feature_cards: "20px"
    hero_media: "0px or match approved mock"
    image_cards: "16px"
    accordions: "12px"

borders:
  standard:
    width: "1px"
    style: "solid"
    colour: "#D8E4EC"

  strong:
    width: "1px"
    style: "solid"
    colour: "#BACBD7"

  selected:
    width: "2px"
    style: "solid"
    colour: "#0D9B8E"

  warning:
    width: "1px"
    style: "solid"
    colour: "#F2CD8E"

  focus:
    width: "3px"
    style: "solid"
    colour: "#1D72D8"
    offset: "3px"

shadows:
  card:
    value: "0 8px 24px rgba(13, 47, 80, 0.08)"

  card_hover:
    value: "0 12px 32px rgba(13, 47, 80, 0.13)"

  elevated:
    value: "0 18px 48px rgba(13, 47, 80, 0.16)"

  header:
    value: "0 4px 16px rgba(13, 47, 80, 0.08)"

  subtle:
    value: "0 2px 8px rgba(13, 47, 80, 0.06)"

  rule:
    - "Avoid heavy or dark shadows."
    - "Use shadows consistently with the SMF page."
    - "Do not use shadows as the only component boundary."

icons:
  library: "Lucide React"
  default_stroke_width: 2

  sizes:
    inline_small: "16px"
    inline_standard: "20px"
    button: "20px"
    card: "24px"
    feature_card: "32px"
    section_heading: "28px"
    large_illustrative: "40px to 56px"

  rules:
    - "Use currentColor when possible."
    - "Use aria-hidden=true for decorative icons."
    - "Provide an accessible name when an icon is the only content of a button."
    - "Do not use emoji in production components."

buttons:
  shared_component_required: true

  dimensions:
    desktop_height: "52px"
    mobile_height: "48px"
    minimum_touch_target: "44px by 44px"
    padding_inline: "24px"
    gap: "10px"
    border_radius: "12px"

  primary:
    background: "#0D9B8E"
    text: "#FFFFFF"
    border: "1px solid #0D9B8E"
    hover_background: "#087A70"
    active_background: "#06675F"
    disabled_opacity: 0.5

  secondary:
    background: "#FFFFFF"
    text: "#143B63"
    border: "1px solid #143B63"
    hover_background: "#EAF6FB"
    active_background: "#DCEEF6"
    disabled_opacity: 0.5

  tertiary:
    background: "transparent"
    text: "#0D9B8E"
    border: "none"
    hover_background: "#DDF5F1"

  focus:
    outline: "3px solid #1D72D8"
    outline_offset: "3px"

  mobile:
    full_width_primary_cta: true
    full_width_secondary_cta: true
    stacked_gap: "12px"

  desktop:
    auto_width: true
    minimum_width: "168px"
    horizontal_group_gap: "16px"

cards:
  standard:
    background: "#FFFFFF"
    border: "1px solid #D8E4EC"
    border_radius: "16px"
    padding_desktop: "24px"
    padding_mobile: "20px"
    shadow: "0 8px 24px rgba(13, 47, 80, 0.08)"

  compact:
    background: "#FFFFFF"
    border: "1px solid #D8E4EC"
    border_radius: "12px"
    padding: "16px"

  selected:
    background: "#F4FCFA"
    border: "2px solid #0D9B8E"
    badge_background: "#0D9B8E"
    badge_text: "#FFFFFF"

  warning:
    background: "#FFF7E8"
    border: "1px solid #F2CD8E"
    border_radius: "16px"

  information:
    background: "#EAF6FB"
    border: "1px solid #CFE7F3"
    border_radius: "16px"

  equal_height_rule:
    desktop: true
    mobile: false
    instruction: "Allow mobile cards to grow naturally according to wrapped content."

tags:
  height: "32px"
  padding_inline: "12px"
  gap: "6px"
  border_radius: "9999px"
  background: "#DDF5F1"
  text: "#087A70"
  font_size: "14px"
  font_weight: 600
  icon_size: "16px"

header:
  shared_component: "SiteHeader"

  desktop:
    height: "80px"
    padding_inline: "80px at 1440px viewport"
    layout: "logo left, navigation centre/right, CTA right"
    logo_max_width: "280px"
    navigation_gap: "28px"
    cta_height: "48px"

  tablet:
    height: "76px"
    padding_inline: "24px to 48px"
    navigation: "Use existing project breakpoint behaviour."

  mobile:
    height: "72px"
    padding_inline: "16px"
    logo_max_width: "220px"
    layout: "logo left, assessment CTA and hamburger right"
    hamburger_target: "44px by 44px"
    assessment_cta_min_height: "44px"

  sticky:
    enabled: "Use existing website behaviour"
    top: "0"
    z_index: 100
    background: "rgba(255, 255, 255, 0.96)"
    backdrop_filter: "blur(12px)"
    shadow_on_scroll: "0 4px 16px rgba(13, 47, 80, 0.08)"

hero:
  assets:
    mobile: "1000104949.png"
    desktop: "1000104957.png"

  desktop:
    minimum_height: "512px"
    recommended_height: "520px to 576px"
    content_grid_span: "columns 1 to 6"
    visual_grid_span: "columns 6 to 13"
    content_alignment: "center"
    background: "#EAF6FB"
    image_fit: "cover"
    image_position: "center right"
    content_gap: "24px"
    button_group_gap: "16px"

  mobile:
    minimum_height: "recommended 640px"
    layout: "stacked content within the approved image-safe composition"
    background: "#EAF6FB"
    image_fit: "cover"
    image_position: "center right"
    content_padding_inline: "16px"
    content_padding_block: "24px 40px"
    content_gap: "16px"
    buttons_stacked: true

  image_rules:
    - "Do not crop the magnifier."
    - "Do not crop the baked-in explanatory sentence."
    - "Do not add duplicate visible explanatory text."
    - "Do not use the desktop asset on mobile."
    - "Do not use the mobile asset on desktop."
    - "Preserve sufficient space for React-rendered heading, tags and buttons."

section_number_badge:
  size: "32px"
  border_radius: "9999px"
  background: "#0D9B8E"
  text: "#FFFFFF"
  font_size: "14px"
  font_weight: 700
