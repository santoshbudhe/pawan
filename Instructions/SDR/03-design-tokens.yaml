    footer:
      font_size: "15px"
      line_height: "24px"
      font_weight: 400

  mobile:
    hero_eyebrow:
      font_size: "13px"
      line_height: "18px"
      font_weight: 700
      letter_spacing: "0.04em"

    hero_title:
      font_size: "clamp(32px, 9vw, 40px)"
      line_height: "1.08"
      font_weight: 800
      letter_spacing: "-0.03em"
      max_width: "100%"

    hero_body:
      font_size: "16px"
      line_height: "25px"
      font_weight: 400
      max_width: "100%"

    section_number:
      font_size: "14px"
      line_height: "20px"
      font_weight: 700

    section_title:
      font_size: "clamp(26px, 7vw, 32px)"
      line_height: "1.18"
      font_weight: 750
      letter_spacing: "-0.02em"

    subsection_title:
      font_size: "22px"
      line_height: "29px"
      font_weight: 700

    card_title:
      font_size: "17px"
      line_height: "24px"
      font_weight: 700

    card_body:
      font_size: "16px"
      line_height: "25px"
      font_weight: 400

    body:
      font_size: "16px"
      line_height: "26px"
      font_weight: 400

    supporting:
      font_size: "14px"
