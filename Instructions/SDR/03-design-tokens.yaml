    object_fit: "cover"
    object_position: "center top"
    border_radius: "9999px"

  patient_story:
    before_after_aspect_ratio: "4 / 3"
    object_fit: "cover"

  loading:
    hero: "eager"
    hero_fetch_priority: "high"
    below_fold: "lazy"
    decoding: "async"

  layout_shift:
    require_width_and_height_attributes: true
    require_aspect_ratio_css: true

forms:
  shared_form_controls: true

  fields:
    minimum_height: "48px"
    border_radius: "12px"
    border: "1px solid #BACBD7"
    padding_inline: "16px"
    background: "#FFFFFF"
    font_size: "16px"

  labels:
    font_size: "15px"
    line_height: "22px"
    font_weight: 600
    colour: "#163A59"

  helper_text:
    font_size: "14px"
    line_height: "21px"
    colour: "#6D8293"

  error:
    colour: "#C44747"
    border_colour: "#C44747"
    message_font_size: "14px"

  focus:
    border_colour: "#1D72D8"
    outline: "3px solid rgba(29, 114, 216, 0.22)"

footer:
  component: "SiteFooter"
  source: "Existing shared website footer"
  render_once: true

  desktop:
    layout: "structured multi-column grid"
    columns: "Use existing shared footer"
    padding_block: "64px"
    gap: "32px"

  mobile:
    layout: "stacked"
    padding_inline: "16px"
    padding_block: "48px"
    section_gap: "24px"

  typography:
    heading_size: "16px"
    heading_weight: 700
    body_size: "14px to 15px"
    line_height: "22px to 24px"

motion:
  duration:
    fast: "150ms"
    standard: "220ms"
    slow: "320ms"

  easing:
    standard: "cubic-bezier(0.2, 0, 0, 1)"
    entrance: "cubic-bezier(0.16, 1, 0.3, 1)"

  hover:
    card_translate_y: "-2px"
    button_translate_y: "-1px"

  reduced_motion:
    media_query: "prefers-reduced-motion: reduce"
    rules:
      - "Disable smooth scrolling."
      - "Disable non-essential card transforms."
      - "Use immediate accordion transitions."
      - "Avoid automatic carousel movement."

z_index:
  base: 0
  content: 1
  sticky_header: 100
  carousel_controls: 10
  dropdown: 200
  modal_backdrop: 900
  modal: 1000
  toast: 1100

responsive_behaviour:
  desktop:
    layout:
      - "Use the 12-column centred grid."
      - "Allow approved two-column and multi-column compositions."
      - "Use 3–5 repeated cards per row according to the section specification."
      - "Keep paragraphs at comfortable reading widths."
      - "Do not stretch cards merely to fill the screen."

  tablet:
    layout:
      - "Use an 8-column grid."
      - "Collapse four-card rows to two cards per row where necessary."
