schema_version: "1.0"

file:
  name: "03-design-tokens.yaml"
  purpose: "Defines the visual design tokens, typography, spacing, grids, component sizing and responsive rules for the SDR procedure page."

design_system:
  name: "Dr. Pawan Kumar Sadhvani Website Design System"
  page_scope: "Selective Dorsal Rhizotomy procedure page"
  reference_page: "Approved SMF procedure page"
  reuse_existing_shared_tokens: true

  precedence:
    - "Existing production website design tokens"
    - "Approved SDR clean mocks"
    - "Approved SDR grid references"
    - "Recommended values in this file"

  rule:
    - "Do not create a conflicting SDR-only visual theme."
    - "Reuse the same shared header, footer, buttons, typography and card language used by the SMF page."
    - "Values labelled recommended may be adjusted only when an existing shared token already provides the equivalent value."
    - "Do not change mobile tokens to accommodate desktop implementation."
    - "Do not change desktop tokens to accommodate mobile implementation."

reference_files:
  clean_mocks:
    mobile_part_1: "1000104948.png"
    mobile_part_2: "1000104953.jpg"
    desktop_part_1: "1000104950.png"
    desktop_part_2: "1000104952.png"

  grid_mocks:
    mobile_part_1: "1000104951.png"
    mobile_part_2: "1000104956.png"
    desktop_part_1: "1000104955.png"
    desktop_part_2: "1000104954.png"

  hero_assets:
    mobile: "1000104949.png"
    desktop: "1000104957.png"

units:
  base_spacing_unit: "8px"
  css_root_font_size: "16px"
  preferred_css_units:
    typography: "rem"
    fixed_controls: "px or rem"
    layout_widths: "px, %, min(), max(), clamp()"
    vertical_spacing: "rem"
  rule: "Prefer CSS variables for all repeated visual values."

css_variable_namespace:
  prefix: "--sdr-"
  shared_prefix_allowed: "--site-"
  recommendation:
    - "Use existing --site-* variables where equivalent tokens already exist."
    - "Create --sdr-* variables only for page-specific values not represented by the shared design system."

colours:
  source_status: "Recommended visual matches derived from the approved mocks. Prefer existing shared project values when already defined."

  brand:
    navy:
      value: "#143B63"
      usage:
        - "Primary headings"
        - "Dark text"
        - "Secondary button borders"
        - "Navigation text"

    navy_deep:
      value: "#0D2F50"
      usage:
        - "High-emphasis headings"
        - "Footer background where consistent with the shared footer"

    teal:
      value: "#0D9B8E"
      usage:
        - "Primary buttons"
        - "Section numbering"
        - "Icons"
        - "Selected states"
        - "Links"
        - "Carousel indicators"

    teal_dark:
      value: "#087A70"
      usage:
        - "Primary-button hover"
        - "Active controls"
        - "Accessible teal text on light backgrounds"

    teal_light:
      value: "#DDF5F1"
      usage:
        - "Tag backgrounds"
        - "Subtle selected-card background"
        - "Information accents"

    blue:
      value: "#2878B8"
      usage:
        - "Medical information accents"
        - "Secondary icons"
        - "Illustration accents"

    blue_light:
      value: "#EAF6FB"
      usage:
        - "Hero background"
        - "Information panels"
        - "Alternating section backgrounds"

  neutral:
    white:
      value: "#FFFFFF"

    page_background:
      value: "#FFFFFF"

    surface:
      value: "#FFFFFF"

    surface_subtle:
      value: "#F7FAFC"

    border:
      value: "#D8E4EC"

    border_strong:
      value: "#BACBD7"

    text_primary:
      value: "#163A59"

    text_secondary:
      value: "#4E667B"

    text_muted:
      value: "#6D8293"

    icon_muted:
      value: "#7890A3"

    overlay:
      value: "rgba(13, 47, 80, 0.52)"

  warning:
    amber:
      value: "#E99A18"

    amber_dark:
      value: "#A86509"

    amber_background:
      value: "#FFF7E8"

    amber_border:
      value: "#F2CD8E"

  success:
    green:
      value: "#198754"

    green_background:
      value: "#EAF7F0"

  danger:
    red:
      value: "#C44747"

    red_background:
      value: "#FCEEEE"

  focus:
    ring:
      value: "#1D72D8"

    ring_offset:
      value: "#FFFFFF"

contrast_rules:
  required_standard: "WCAG 2.1 AA"
  body_text_minimum_ratio: "4.5:1"
  large_text_minimum_ratio: "3:1"
  controls_minimum_ratio: "3:1"
  requirements:
    - "Do not use light teal text on white for body copy."
    - "Do not use amber as the only warning indicator."
    - "Pair warning colour with an icon, title or border."
    - "Ensure text over the hero asset remains readable at every breakpoint."

typography:
