    primary:
      value: "inherit from existing website"
      fallback: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"

    rule:
      - "Do not introduce a new SDR-specific typeface."
      - "Use the same font stack as the existing homepage and SMF page."

  font_weights:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
    extra_bold: 800

  desktop:
    hero_eyebrow:
