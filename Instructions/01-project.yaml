project:
  name: Dr Pawan Kumar Sadhvani — SMF Procedure Page
  page_name: Selective Motor Fasciculotomy (SMF)
  page_kind: medical-procedure-detail
  route: /procedures/selective-motor-fasciculotomy
  framework: React
  language: TypeScript
  styling: Tailwind CSS
  hosting: Firebase Hosting
  asset_delivery: Firebase Storage or existing project asset resolver
  implementation_mode: mobile-first
non_negotiables:
- Do not redesign any approved section.
- Do not alter approved copy, section numbering, section order, branding or medical wording.
- Part 1 and Part 2 are one continuous page.
- Do not render the reference-only Part 1/Part 2 seam labels.
- Do not duplicate the header at the Part 2 seam.
- Desktop must follow the desktop mock and mobile must follow the mobile mock.
- Do not derive desktop by merely stretching mobile.
- Do not allow desktop CSS rules to alter the approved mobile composition.
- Use semantic HTML and keyboard-accessible controls.
- Do not use screenshots as production page content.
- Do not bake text, buttons or interface icons into image assets.
quality_targets:
  typescript_strict: true
  responsive: true
  accessible: true
  seo_ready: true
  lighthouse_targets:
    performance: 90
    accessibility: 95
    best_practices: 95
    seo: 95
reference_precedence:
- clean mocks
- grid mocks
- handoff specifications
- existing shared site implementation
