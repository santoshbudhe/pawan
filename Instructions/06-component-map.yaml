implementation_rules:
- Use data-driven map rendering for repeated cards and steps.
- Use one reusable carousel primitive for problems, comparison and stories, configured per section.
- Use one reusable accordion primitive for risks and FAQ.
- Use semantic section elements with stable ids.
- Use shared CTA button components and existing modal/route behaviour.
- No component should contain hard-coded responsive pixel positioning.
- Do not use absolute positioning for normal section layout.
